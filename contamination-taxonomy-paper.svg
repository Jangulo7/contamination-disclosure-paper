<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b03a2e"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d1f"/>
    </marker>
  </defs>

  <rect width="780" height="450" fill="#ffffff"/>

  <!-- ============ TRAINING TIME ============ -->
  <text x="8" y="16" font-size="12" letter-spacing="1.6" fill="#b03a2e">TRAINING TIME · THE DATA REACHES THE MODEL</text>

  <rect x="8" y="46" width="118" height="48" rx="2" fill="#ffffff" stroke="#8a96a3"/>
  <text x="67" y="70" font-size="13" text-anchor="middle" fill="#1c2733" letter-spacing="1">THE WEB</text>
  <text x="67" y="85" font-size="11" text-anchor="middle" fill="#7b8794" font-style="italic">everything scraped</text>

  <rect x="168" y="46" width="174" height="48" rx="2" fill="#ffffff" stroke="#8a96a3"/>
  <text x="255" y="68" font-size="13" text-anchor="middle" fill="#1c2733">PRETRAINING CORPUS</text>
  <text x="255" y="85" font-size="11" text-anchor="middle" fill="#7b8794" font-style="italic">what the model read</text>

  <rect x="392" y="46" width="96" height="48" rx="2" fill="#ffffff" stroke="#8a96a3"/>
  <text x="440" y="76" font-size="13" text-anchor="middle" fill="#1c2733" letter-spacing="1">MODEL</text>

  <rect x="540" y="46" width="124" height="48" rx="2" fill="#ffffff" stroke="#1c2733" stroke-width="1.6"/>
  <text x="602" y="76" font-size="13" text-anchor="middle" fill="#1c2733" letter-spacing="1">BENCHMARK</text>

  <rect x="176" y="176" width="158" height="46" rx="2" fill="#ffffff" stroke="#8a96a3"/>
  <text x="255" y="197" font-size="12" text-anchor="middle" fill="#1c2733">SOURCE DATA</text>
  <text x="255" y="213" font-size="11" text-anchor="middle" fill="#7b8794" font-style="italic">what it was built from</text>

  <line x1="128" y1="70" x2="164" y2="70" stroke="#7b8794" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="344" y1="70" x2="388" y2="70" stroke="#7b8794" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="538" y1="84" x2="492" y2="84" stroke="#7b8794" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="515" y="78" font-size="11" text-anchor="middle" fill="#7b8794" font-style="italic">tested on</text>

  <!-- 1 direct -->
  <path d="M 602 42 L 602 24 L 255 24 L 255 42" fill="none" stroke="#b03a2e" stroke-width="1.5" marker-end="url(#arR)"/>
  <circle cx="428" cy="24" r="11" fill="#b03a2e"/>
  <text x="428" y="28" font-size="11" text-anchor="middle" fill="#ffffff">1</text>

  <!-- 2 derivative -->
  <line x1="255" y1="172" x2="255" y2="98" stroke="#b03a2e" stroke-width="1.5" marker-end="url(#arR)"/>
  <circle cx="255" cy="135" r="11" fill="#b03a2e"/>
  <text x="255" y="139" font-size="11" text-anchor="middle" fill="#ffffff">2</text>
  <path d="M 602 98 L 602 199 L 340 199" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="470" y="193" font-size="11" text-anchor="middle" fill="#7b8794" font-style="italic">built from</text>

  <!-- 3 temporal -->
  <line x1="440" y1="98" x2="440" y2="122" stroke="#b03a2e" stroke-width="1.5"/>
  <circle cx="440" cy="135" r="11" fill="#b03a2e"/>
  <text x="440" y="139" font-size="11" text-anchor="middle" fill="#ffffff">3</text>
  <text x="459" y="132" font-size="11" fill="#4a5560">cutoff AFTER</text>
  <text x="459" y="145" font-size="11" fill="#4a5560">the phenomenon</text>

  <!-- 4 distributional -->
  <line x1="666" y1="70" x2="682" y2="70" stroke="#b03a2e" stroke-width="1.5"/>
  <circle cx="695" cy="70" r="11" fill="#b03a2e"/>
  <text x="695" y="74" font-size="11" text-anchor="middle" fill="#ffffff">4</text>
  <text x="712" y="66" font-size="11" fill="#4a5560">pattern,</text>
  <text x="712" y="79" font-size="11" fill="#4a5560">not items</text>

  <!-- ============ DIVIDER ============ -->
  <line x1="8" y1="248" x2="772" y2="248" stroke="#b8c2cc" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ============ EVALUATION TIME ============ -->
  <text x="8" y="274" font-size="12" letter-spacing="1.6" fill="#8a6d1f">EVALUATION TIME · THE MODEL REACHES THE DATA</text>

  <rect x="372" y="300" width="390" height="66" rx="2" fill="#fbf6e8" stroke="#8a6d1f" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="394" y="326" font-size="12" fill="#8a6d1f" letter-spacing="1.4">SANDBOX</text>
  <text x="394" y="343" font-size="11" fill="#8a6d1f" font-style="italic">isolation, no egress</text>
  <rect x="560" y="314" width="186" height="38" rx="2" fill="#ffffff" stroke="#8a96a3"/>
  <text x="653" y="338" font-size="12" text-anchor="middle" fill="#1c2733">MODEL UNDER TEST</text>

  <rect x="40" y="378" width="176" height="44" rx="2" fill="#ffffff" stroke="#8a6d1f"/>
  <text x="128" y="398" font-size="12" text-anchor="middle" fill="#1c2733">THE ANSWER KEY</text>
  <text x="128" y="414" font-size="11" text-anchor="middle" fill="#7b8794" font-style="italic">git history · web · database</text>

  <path d="M 653 356 L 653 400 L 232 400" fill="none" stroke="#8a6d1f" stroke-width="2"/>
  <path d="M 240 400 L 222 400" fill="none" stroke="#8a6d1f" stroke-width="2" marker-end="url(#arG)"/>
  <circle cx="420" cy="400" r="11" fill="#8a6d1f"/>
  <text x="420" y="404" font-size="11" text-anchor="middle" fill="#ffffff">5</text>
  <text x="470" y="418" font-size="11" fill="#8a6d1f" font-style="italic">breaks out, goes and gets it</text>

  <text x="8" y="442" font-size="10" fill="#8a96a3">Contamination taxonomy v1.1 · CC BY 4.0</text>
</svg>
